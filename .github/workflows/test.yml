name: offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }} / Pi ${{ matrix.pi }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Pin the patched Node 24 release. The floating 24.x label selected
        # Node 24.15.0 on the failing Windows run, where npm ci could crash
        # while unpacking the dependency tree.
        node: [24.16.0]
        pi: [1.4.0]
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Install Pi host
        run: npm install --global --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@${{ matrix.pi }}
      - name: Install local verification tools
        run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Configure Pi host path
        run: node scripts/ci-host.mjs
      - name: Check extension entry points
        run: npm run check
      - name: Verify Pi source snapshot and dependency baseline
        run: node scripts/check-pi-source.mjs
      - name: Run offline tests
        run: npm test
      - name: Type check v2
        run: npm run typecheck
